<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>M_DEV Cars — A cinematic 3D car showcase</title>
    <meta
      name="description"
      content="M_DEV Cars is an interactive 3D car experience: scroll through a cinematic studio tour, explore the design up close, and pick your own paint in real time."

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050609" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="__SITE_URL__/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="M_DEV Cars" />
    <meta property="og:title" content="M_DEV Cars — A cinematic 3D car showcase" />

      property="og:description"
      content="Scroll through a cinematic studio tour, explore the design up close, and pick your own paint in real time."
    />

      name="twitter:description"
      content="Scroll through a cinematic studio tour, explore the design up close, and pick your own paint in real time."

    <link rel="preload" href="/models/car.glb" as="fetch" type="model/gltf-binary" crossorigin />
